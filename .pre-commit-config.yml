repos:
  - repo: local
    hooks:
      - id: frontend-eslint
        name: ESLint (frontend)
        entry: "bash -c 'cd frontend && npx eslint --fix --max-warnings=0 \"$@\"' --"
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx)$
        pass_filenames: true

      - id: frontend-prettier
        name: Prettier (frontend)
        entry: "bash -c 'cd frontend && npx prettier --write \"$@\"' --"
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx|css|scss|html|json|md)$
        pass_filenames: true

      - id: frontend-typecheck
        name: TypeScript check (frontend)
        entry: "bash -c 'cd frontend && npx tsc --noEmit'"
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false

  - repo: local
    hooks:
      - id: backend-eslint
        name: ESLint (backend)
        entry: "bash -c 'cd backend && npx eslint --fix --max-warnings=0 \"$@\"' --"
        language: system
        files: ^backend/.*\.(js|ts)$
        pass_filenames: true

      - id: backend-prettier
        name: Prettier (backend)
        entry: "bash -c 'cd backend && npx prettier --write \"$@\"' --"
        language: system
        files: ^backend/.*\.(js|ts|json|md)$
        pass_filenames: true

      - id: backend-typecheck
        name: TypeScript check (backend)
        entry: "bash -c 'cd backend && npx tsc --noEmit'"
        language: system
        files: ^backend/.*\.(ts|js)$
        pass_filenames: false