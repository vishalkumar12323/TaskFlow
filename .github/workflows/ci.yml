name: CI Pipeline

on:
  push:
  #   branches: [main, master, develop]
  # pull_request:
  #   branches: [main, master, develop]
  # workflow_dispatch:

jobs:
  frontend_lint_format_check:
    name: frontend-lint
    uses: ./.github/workflows/frontend-lint-format-check.yml

  backend_lint_format_check:
    name: backend-lint
    uses: ./.github/workflows/backend-lint-format-check.yml

  frontend_vulnerability_check:
    name: frontend-vulnerability
    uses: ./.github/workflows/frontend-vulnerability-check.yml

  pipeline_success:
    name: Pipeline Success
    needs:
      [
        frontend_lint_format_check,
        backend_lint_format_check,
        frontend_vulnerability_check,
      ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify required checks
        if: needs.frontend_lint_format_check.result != 'success' || needs.backend_lint_format_check.result != 'success' || needs.frontend_vulnerability_check.result != 'success'
        run: |
          echo "Frontend check: ${{ needs.frontend_lint_format_check.result }}"
          echo "Backend check: ${{ needs.backend_lint_format_check.result }}"
          echo "Frontend vulnerability check: ${{ needs.frontend_vulnerability_check.result }}"
          exit 1

      - name: Report pipeline success
        run: echo "All required CI checks passed."

  deploy:
    name: Deploy to AWS
    needs: [pipeline_success]
    if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    permissions:
      id-token: write
      contents: read
